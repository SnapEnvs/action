name: SnapEnvs preview
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      api-url:
        type: string
        default: https://snapenvs.com
      free-runner-disk:
        description: Remove preinstalled toolchains the build does not use before building
        type: boolean
        default: true
    outputs:
      preview-url:
        description: Preview URL
        value: ${{ jobs.preview.outputs.preview-url }}
      environment-id:
        description: SnapEnvs environment ID
        value: ${{ jobs.preview.outputs.environment-id }}
      configuration-revision:
        description: Configuration revision
        value: ${{ jobs.preview.outputs.configuration-revision }}
      deployment-skipped:
        description: Release accepted without starting a deployment
        value: ${{ jobs.preview.outputs.deployment-skipped }}
permissions:
  contents: read
  id-token: write
concurrency:
  group: snapenvs-${{ github.repository_id }}-${{ inputs.project }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
      environment-id: ${{ steps.deploy.outputs.environment-id }}
      configuration-revision: ${{ steps.deploy.outputs.configuration-revision }}
      deployment-skipped: ${{ steps.deploy.outputs.deployment-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Free runner disk
        if: inputs.free-runner-disk
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tail -n 1
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf "$path" &
          done
          wait
          docker image prune --all --force > /dev/null
          df -h / | tail -n 1
      - name: Build and deploy preview
        id: deploy
        uses: SnapEnvs/action@9cbb291791f3ebfbc133491a67794fb82715db6d
        with:
          project: ${{ inputs.project }}
          api-url: ${{ inputs.api-url }}
